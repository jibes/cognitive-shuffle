<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0805">
<meta name="color-scheme" content="dark">
<title>Einschlafwörter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@1,6..72,300&display=swap">
<style>
  :root {
    --bg: #0e0805;
    --text: #c4875a;
    --muted: #6b4630;
    --line: #2a1a11;
    color-scheme: dark;
  }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--muted);
    overflow: hidden;
    overscroll-behavior: none;
  }
  body {
    font-family: "Newsreader", Georgia, serif;
    font-style: italic;
    font-weight: 300;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    touch-action: manipulation;
  }
  [hidden] { display: none !important; }

  #start {
    box-sizing: border-box;
    height: 100%;
    max-width: 28rem;
    margin: 0 auto;
    padding:
      max(24px, env(safe-area-inset-top))
      max(16px, env(safe-area-inset-right))
      max(32px, env(safe-area-inset-bottom))
      max(16px, env(safe-area-inset-left));
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    gap: 28px;
  }
  .hint {
    margin: 0 0 auto;
    padding-top: 16vh;
    font-size: 1.4rem;
    line-height: 1.45;
    color: var(--text);
    opacity: .7;
  }
  .label {
    display: block;
    margin: 0 0 10px 4px;
    font-size: 1.05rem;
  }
  .row { display: flex; gap: 10px; }
  .col { display: flex; flex-direction: column; gap: 14px; }
  button {
    font: inherit;
    font-size: 1.45rem;
    color: var(--text);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 999px;
    min-height: 64px;
    width: 100%;
    padding: 0 16px;
    cursor: pointer;
    -webkit-appearance: none;
    appearance: none;
  }
  button:focus { outline: none; }
  button:focus-visible { border-color: var(--muted); }
  button:active { background: var(--line); }
  .noise button {
    font-size: 1.15rem;
    min-height: 52px;
    color: var(--muted);
  }
  .noise button[aria-checked="true"] {
    color: var(--text);
    background: var(--line);
  }
  .status {
    margin: 0;
    min-height: 1.4em;
    text-align: center;
    font-size: 1.05rem;
  }

  #stage {
    position: fixed;
    inset: 0;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    padding:
      env(safe-area-inset-top) max(16px, env(safe-area-inset-right))
      env(safe-area-inset-bottom) max(16px, env(safe-area-inset-left));
    cursor: none;
  }
  #word {
    font-size: clamp(2.2rem, 9vw, 4.5rem);
    line-height: 1.15;
    color: var(--text);
    text-align: center;
    overflow-wrap: break-word;
    hyphens: auto;
    max-width: 100%;
    opacity: 0;
  }
  #word.night { transition: opacity 2.5s ease-in-out; }
  #tapplay {
    position: absolute;
    left: 0;
    right: 0;
    bottom: max(48px, calc(env(safe-area-inset-bottom) + 32px));
    text-align: center;
    font-size: 1.2rem;
    opacity: .8;
  }
</style>
</head>
<body>

<main id="start">
  <p class="hint">Dauer antippen, Handy weglegen und den Wörtern zuhören, bis sie von selbst verklingen.</p>
  <div>
    <span class="label" id="noise-label">Rauschen</span>
    <div class="row noise" role="radiogroup" aria-labelledby="noise-label">
      <button type="button" role="radio" data-noise="aus">aus</button>
      <button type="button" role="radio" data-noise="leise">leise</button>
      <button type="button" role="radio" data-noise="mittel">mittel</button>
    </div>
  </div>
  <div class="col">
    <button type="button" data-min="10">10 Minuten</button>
    <button type="button" data-min="15">15 Minuten</button>
    <button type="button" data-min="25">25 Minuten</button>
  </div>
  <p class="status" id="status" aria-live="polite"></p>
</main>

<div id="stage" hidden>
  <div id="word" aria-live="off"></div>
  <div id="tapplay" hidden>Tippen zum Abspielen</div>
</div>

<audio id="player" preload="auto" playsinline webkit-playsinline></audio>

<script>
"use strict";
const CLIPS = __CLIPS__;
const WORDS = Object.keys(CLIPS);

// Verlauf über die Sitzung: Start -> Ende
const LEAD = 2, TAIL = 30;          // s
const GAP = [8, 20];                // Abstand der Wortanfänge, s
const VOL = [0.85, 0.35];           // Stimme
const GLOW = [0.6, 0.1];            // Helligkeit des Wortes
const FADE_IN = [1.5, 4];           // s
const HOLD = 5, FADE_OUT = 2.5;     // ausblenden ab 5 s nach Wortanfang
const MAX_CLIP = 3;                 // s, Sicherheitsabstand vor Sitzungsende
const NOISE_DB = { aus: null, leise: -43, mittel: -35 };  // RMS, dBFS
const NOISE_CORNER = 40;            // Hz, braunes Rauschen ab hier 1/f²
const RATES = [22050, 16000, 44100];
const MAX_OUT_RATE = 24000;
const LONG_PRESS = 900;             // ms, beendet die Sitzung

const $ = id => document.getElementById(id);
const startEl = $("start"), stage = $("stage"), wordEl = $("word"),
      tapPlay = $("tapplay"), statusEl = $("status"), audio = $("player");

const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
};
const lerp = (r, p) => r[0] + (r[1] - r[0]) * p;

// ---------- WAV ----------
function wavBuffer(samples, rate) {
  const buf = new ArrayBuffer(44 + samples * 2), v = new DataView(buf);
  const str = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  str(0, "RIFF"); v.setUint32(4, 36 + samples * 2, true); str(8, "WAVE");
  str(12, "fmt "); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true);
  v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  str(36, "data"); v.setUint32(40, samples * 2, true);
  return buf;
}
const SILENT_URL = URL.createObjectURL(new Blob([wavBuffer(800, 8000)], { type: "audio/wav" }));

// ---------- Dekodieren ----------
function b64ToBuffer(s) {
  const b = atob(s), u = new Uint8Array(b.length);
  for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i);
  return u.buffer;
}
function decodeWith(ctx, buf) {
  // Promise- und Callback-Variante (ältere Safari)
  return new Promise((resolve, reject) => {
    let p;
    try { p = ctx.decodeAudioData(buf, resolve, reject); } catch (e) { reject(e); return; }
    if (p && typeof p.then === "function") p.then(resolve, reject);
  });
}
let decoderP = null;
function getDecoder() {
  if (!decoderP) decoderP = (async () => {
    const C = window.OfflineAudioContext || window.webkitOfflineAudioContext;
    if (!C) throw new Error("kein OfflineAudioContext");
    for (const rate of RATES) {
      try {
        const ctx = new C(1, rate, rate);
        const ab = await decodeWith(ctx, b64ToBuffer(CLIPS[WORDS[0]]));
        const factor = Math.ceil(ab.sampleRate / MAX_OUT_RATE);
        return { ctx, factor, outRate: Math.round(ab.sampleRate / factor) };
      } catch (e) { /* nächste Rate */ }
    }
    throw new Error("Dekodieren nicht möglich");
  })();
  return decoderP;
}
const pcm = new Map();  // Wort -> Promise<Float32Array> in outRate
function getPcm(w) {
  if (!pcm.has(w)) pcm.set(w, getDecoder().then(async d => {
    const x = (await decodeWith(d.ctx, b64ToBuffer(CLIPS[w]))).getChannelData(0);
    if (d.factor === 1) return x;
    const n = Math.floor(x.length / d.factor), y = new Float32Array(n);
    for (let i = 0; i < n; i++) {
      let s = 0;
      for (let k = 0; k < d.factor; k++) s += x[i * d.factor + k];
      y[i] = s / d.factor;
    }
    return y;
  }));
  return pcm.get(w);
}

// ---------- Wortfolge: ohne Wiederholung, bis die Liste durch ist (auch über Nächte) ----------
function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function loadDeck() {
  try {
    const d = JSON.parse(store.get("ew-deck"));
    if (d && Array.isArray(d.order) && d.order.length === WORDS.length &&
        d.order.every(w => w in CLIPS) && d.pos >= 0) return d;
  } catch (e) {}
  return { order: shuffle(WORDS.slice()), pos: 0 };
}
function drawWords(n) {
  const d = loadDeck(), out = [];
  while (out.length < n) {
    if (d.pos >= d.order.length) {
      d.order = shuffle(WORDS.slice());
      d.pos = 0;
      if (d.order[0] === out[out.length - 1]) d.order.push(d.order.shift());
    }
    out.push(d.order[d.pos++]);
  }
  return { words: out, deck: d };
}

// ---------- Sitzung mischen ----------
function onsetsFor(dur) {
  const on = [];
  for (let t = LEAD; t + MAX_CLIP <= LEAD + dur; ) {
    const p = (t - LEAD) / dur;
    on.push({ t, p });
    t += lerp(GAP, p);
  }
  return on;
}

async function buildSession(minutes, noiseKey) {
  const dur = minutes * 60;
  const on = onsetsFor(dur);
  const { words, deck } = drawWords(on.length);
  on.forEach((o, i) => { o.w = words[i]; });
  const { outRate: rate } = await getDecoder();
  const clips = await Promise.all(words.map(getPcm));

  const total = Math.ceil((LEAD + dur + TAIL) * rate);
  const buf = wavBuffer(total, rate);
  const out = new Int16Array(buf, 44, total);

  const db = NOISE_DB[noiseKey];
  if (db != null) {
    // Braunes Rauschen: Leaky-Integrator, Pegel analytisch aus der Varianz
    const a = Math.exp(-2 * Math.PI * NOISE_CORNER / rate);
    const sd = Math.sqrt((1 / 3) / (1 - a * a));
    const g = 32767 * Math.pow(10, db / 20) / sd;
    const inEnd = LEAD * rate, outStart = (LEAD + dur) * rate, outLen = TAIL * rate;
    let y = 0;
    for (let i = 0; i < total; i++) {
      y = a * y + (Math.random() * 2 - 1);
      let e = 1;
      if (i < inEnd) e = i / inEnd;
      else if (i > outStart) { const r = 1 - (i - outStart) / outLen; e = r > 0 ? r * r : 0; }
      out[i] = y * g * e;
    }
  }
  on.forEach((o, i) => {
    const x = clips[i], gain = 32767 * lerp(VOL, o.p), s0 = Math.round(o.t * rate);
    const n = Math.min(x.length, total - s0);
    for (let j = 0; j < n; j++) {
      const v = out[s0 + j] + x[j] * gain;
      out[s0 + j] = v > 32767 ? 32767 : v < -32768 ? -32768 : v;
    }
  });
  return { url: URL.createObjectURL(new Blob([buf], { type: "audio/wav" })), on, deck };
}

// ---------- Vorbereiten im Hintergrund (für die längste Dauer) ----------
function prewarm() {
  const n = onsetsFor(25 * 60).length;
  const { words } = drawWords(n);
  let i = 0;
  const next = () => { if (i < words.length) getPcm(words[i++]).then(next, () => {}); };
  getDecoder().then(() => { for (let k = 0; k < 4; k++) next(); }, () => {});
}

// ---------- Anzeige ----------
let session = null, rafId = 0, lastOp = "", phase = "start";

function frame() {
  rafId = 0;
  if (!session) return;
  const ct = audio.currentTime, on = session.on;
  let i = session.idx;
  while (i + 1 < on.length && on[i + 1].t <= ct) i++;
  while (i >= 0 && on[i].t > ct) i--;
  session.idx = i;
  let op = 0;
  if (i >= 0) {
    const o = on[i], el = ct - o.t;
    const fi = Math.min(1, el / lerp(FADE_IN, o.p));
    const fo = Math.max(0, 1 - Math.max(0, el - HOLD) / FADE_OUT);
    op = lerp(GLOW, o.p) * fi * fi * (3 - 2 * fi) * fo;
    if (wordEl.textContent !== o.w) wordEl.textContent = o.w;
  }
  const s = op.toFixed(3);
  if (s !== lastOp) { wordEl.style.opacity = s; lastOp = s; }
  rafId = requestAnimationFrame(frame);
}
function startFrames() { if (!rafId) rafId = requestAnimationFrame(frame); }

function skip() {
  if (!session) return;
  const ct = audio.currentTime;
  const nx = session.on.find(o => o.t - 0.3 > ct + 0.05);
  if (nx) audio.currentTime = nx.t - 0.3;
}

function showStart(msg) {
  phase = "start";
  stage.hidden = true;
  startEl.hidden = false;
  statusEl.textContent = msg || "";
}
function teardown() {
  session = null;
  if (rafId) cancelAnimationFrame(rafId), rafId = 0;
  const old = audio.src;
  audio.pause();
  audio.removeAttribute("src");
  audio.load();
  if (old && old.startsWith("blob:") && old !== SILENT_URL) URL.revokeObjectURL(old);
  wordEl.classList.remove("night");
  wordEl.style.opacity = "0";
  wordEl.textContent = "";
  lastOp = "";
  tapPlay.hidden = true;
}

function goodNight() {
  teardown();
  phase = "night";
  wordEl.textContent = "Gute Nacht";
  wordEl.classList.add("night");
  requestAnimationFrame(() => requestAnimationFrame(() => { wordEl.style.opacity = "0.12"; }));
  setTimeout(() => { wordEl.style.opacity = "0"; }, 6000);
  setTimeout(() => { if (phase === "night") phase = "done"; }, 9000);
}

function tryPlay() {
  const p = audio.play();
  if (p && p.then) p.then(() => { tapPlay.hidden = true; }, () => { tapPlay.hidden = false; });
}

async function start(minutes) {
  if (phase !== "start") return;
  phase = "building";
  // iOS: Element noch im Tap freischalten, danach src tauschen
  audio.src = SILENT_URL;
  const p = audio.play();
  if (p && p.catch) p.catch(() => {});
  startEl.hidden = true;
  stage.hidden = false;
  try {
    const s = await buildSession(minutes, noiseKey);
    if (phase !== "building") { URL.revokeObjectURL(s.url); return; }
    store.set("ew-deck", JSON.stringify(s.deck));
    session = { on: s.on, idx: -1 };
    phase = "playing";
    audio.src = s.url;
    if ("mediaSession" in navigator && typeof MediaMetadata !== "undefined") {
      navigator.mediaSession.metadata = new MediaMetadata({ title: "Einschlafwörter", artist: "Wörter zum Einschlafen" });
      try { navigator.mediaSession.setActionHandler("nexttrack", skip); } catch (e) {}
    }
    tryPlay();
    startFrames();
  } catch (e) {
    teardown();
    showStart("Der Ton ließ sich nicht vorbereiten.");
  }
}

// ---------- Bedienung ----------
let noiseKey = store.get("ew-noise");
if (!(noiseKey in NOISE_DB)) noiseKey = "leise";
function renderNoise() {
  document.querySelectorAll("[data-noise]").forEach(b =>
    b.setAttribute("aria-checked", String(b.dataset.noise === noiseKey)));
}
document.querySelectorAll("[data-noise]").forEach(b => b.addEventListener("click", () => {
  noiseKey = b.dataset.noise;
  store.set("ew-noise", noiseKey);
  renderNoise();
}));
document.querySelectorAll("[data-min]").forEach(b =>
  b.addEventListener("click", () => start(Number(b.dataset.min))));

let pressTimer = 0, longFired = false;
stage.addEventListener("pointerdown", () => {
  longFired = false;
  clearTimeout(pressTimer);
  pressTimer = setTimeout(() => {
    longFired = true;
    if (phase === "playing" || phase === "building") { teardown(); showStart(); }
  }, LONG_PRESS);
});
stage.addEventListener("pointerup", () => clearTimeout(pressTimer));
stage.addEventListener("pointercancel", () => clearTimeout(pressTimer));
stage.addEventListener("click", () => {
  if (longFired) return;
  if (phase === "playing") {
    if (audio.paused) tryPlay(); else skip();
    startFrames();
  } else if (phase === "done") {
    showStart();
  }
});
stage.addEventListener("contextmenu", e => e.preventDefault());

audio.addEventListener("ended", () => { if (phase === "playing") goodNight(); });
audio.addEventListener("play", startFrames);

renderNoise();
prewarm();
</script>
</body>
</html>

<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0805">
<meta name="color-scheme" content="dark">
<title>Einschlafwörter</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@1,6..72,300&display=swap">
<link rel="stylesheet" href="css/app.css">
<script type="module" src="js/main.js"></script>
</head>
<body>

<main id="start">
  <div class="lang" role="radiogroup" aria-label="Sprache / Language" id="lang"></div>
  <p class="hint" data-t="hint"></p>
  <div>
    <span class="label" id="noise-label" data-t="noise"></span>
    <div class="row noise" role="radiogroup" aria-labelledby="noise-label">
      <button type="button" role="radio" data-noise="off" data-t="noiseOff"></button>
      <button type="button" role="radio" data-noise="soft" data-t="noiseSoft"></button>
      <button type="button" role="radio" data-noise="medium" data-t="noiseMedium"></button>
    </div>
  </div>
  <div class="col">
    <button type="button" data-min="10" data-t="min10"></button>
    <button type="button" data-min="15" data-t="min15"></button>
    <button type="button" data-min="25" data-t="min25"></button>
  </div>
  <p class="status" id="status" aria-live="polite"></p>
</main>

<div id="stage" hidden>
  <div id="word" aria-live="off"></div>
  <div id="tapplay" hidden data-t="tap"></div>
</div>

<audio id="player" preload="auto" playsinline webkit-playsinline></audio>

</body>
</html>
